name: RAG Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3

      - name: Run evaluation (heuristic mode)
        run: |
          python evaluation/run_eval.py --no-llm --output eval_report.json

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval_report.json

      - name: Check evaluation results
        run: |
          python -c "
          import json
          with open('eval_report.json') as f:
              report = json.load(f)
          agg = report['aggregate']
          thresholds = report['thresholds']
          failed = []
          for m in ['retrieval_precision', 'citation_coverage', 'faithfulness']:
              if agg[m] < thresholds[m]:
                  failed.append(f'{m}: {agg[m]:.4f} < {thresholds[m]}')
          if failed:
              print('❌ Quality regression detected:')
              for f in failed:
                  print(f'  {f}')
              exit(1)
          else:
              print('✅ All evaluation metrics pass')
          "
