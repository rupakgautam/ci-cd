name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Stage 1: Lint ─────────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check .

      - name: Check ruff formatting
        run: ruff format --check .

  # ─── Stage 2: Test ─────────────────────────────────────────────
  test:
    name: 🧪 Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ─── Stage 3: Docker Build ─────────────────────────────────────
  build:
    name: 🐳 Docker Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rag-ollama-citation:test .

      - name: Start container and health check
        run: |
          docker run -d --name rag-test -p 8000:8000 rag-ollama-citation:test
          sleep 5
          # Health check — the /health endpoint should respond
          curl -f http://localhost:8000/health || (docker logs rag-test && exit 1)
          docker stop rag-test

  # ─── Stage 4: Security Scan ────────────────────────────────────
  security:
    name: 🔒 Security Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --strict --desc
